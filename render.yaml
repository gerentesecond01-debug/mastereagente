# Render Blueprint: cria o banco, o painel Master e o Agent.
# No Render, use New + Blueprint e selecione este repositório.
services:
  - type: web
    name: sl-bot-master
    runtime: node
    plan: free
    region: ohio
    rootDir: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sl-bot-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: sl-bot-agent
    runtime: node
    plan: free
    region: ohio
    rootDir: agent
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MASTER_HOST
        fromService:
          type: web
          name: sl-bot-master
          property: host
      - key: AGENT_KEY
        value: sl-agent-1

databases:
  - name: sl-bot-db
    plan: free
    region: ohio
    databaseName: slbot
    user: slbot
