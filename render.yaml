# Um único serviço Web hospeda painel + Agent. O banco permanece como serviço de dados.
services:
  - type: web
    name: mastereagente
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sl-bot-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: RUN_LOCAL_AGENT
        value: "true"
      - key: AGENT_KEY
        value: sl-agent-local

databases:
  - name: sl-bot-db
    plan: free
    region: ohio
    databaseName: slbot
    user: slbot
