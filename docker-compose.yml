services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slbot
      POSTGRES_USER: slbot
      POSTGRES_PASSWORD: slbot-local-password
    volumes:
      - slbot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slbot -d slbot"]
      interval: 5s
      timeout: 5s
      retries: 20

  master:
    build: ./master
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 10000
      NODE_ENV: production
    ports:
      - "${MASTER_PORT:-10000}:10000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      PORT: 10001
      MASTER_URL: http://master:10000
      AGENT_KEY: agent-local-1
      AGENT_PUBLIC_URL: http://agent:10001
      BOT_ID: 0
    depends_on:
      - master

volumes:
  slbot_db:
